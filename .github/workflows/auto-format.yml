name: Auto Format

on:
  push:
    branches:
      - main
      - vertexai

jobs:
  prettier:
    name: Prettier Auto-Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format

      - name: Create pull request for formatting changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "style: auto-format with prettier"
          title: "style: auto-format with prettier"
          body: |
            Automated formatting fixes by Prettier.

            Triggered by a push that contained unformatted files.
          branch: auto-format/prettier
          delete-branch: true

      - name: Auto-merge pull request
        run: gh pr merge auto-format/prettier --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}