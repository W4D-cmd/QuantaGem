services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    volumes:
      - db_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    restart: unless-stopped
    command: ["mini", "-webdav=false", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z@sha256:064117214caceaa8d8a90ef7caa58f2b2aeb316b5156afe9ee8da5b4d83e12c8
    profiles: ["legacy"]
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrate-storage:
    image: rclone/rclone:1.75.1
    profiles: ["migrate"]
    depends_on:
      minio:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      SRC_ACCESS_KEY: ${MINIO_ROOT_USER}
      SRC_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SRC_BUCKET: ${MINIO_DEFAULT_BUCKET:-chat-files}
      DST_ACCESS_KEY: ${S3_ACCESS_KEY}
      DST_SECRET_KEY: ${S3_SECRET_KEY}
      DST_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rclone config create src s3 provider=Minio access_key_id="$$SRC_ACCESS_KEY" secret_access_key="$$SRC_SECRET_KEY" endpoint="http://minio:9000" force_path_style=true --config /config/rclone.conf --non-interactive
        rclone config create dst s3 provider=Minio access_key_id="$$DST_ACCESS_KEY" secret_access_key="$$DST_SECRET_KEY" endpoint="http://seaweedfs:8333" force_path_style=true --config /config/rclone.conf --non-interactive
        echo "=== [migrate] rclone copy src:$$SRC_BUCKET -> dst:$$DST_BUCKET ==="
        rclone copy "src:$$SRC_BUCKET" "dst:$$DST_BUCKET" --config /config/rclone.conf --transfers 8 --checkers 16 --s3-no-check-bucket --stats 30s
        echo "=== [migrate] rclone check (verify zero differences) ==="
        rclone check "src:$$SRC_BUCKET" "dst:$$DST_BUCKET" --config /config/rclone.conf --checkers 16
        echo "=== [migrate] rclone size (src) ==="
        rclone size "src:$$SRC_BUCKET" --config /config/rclone.conf
        echo "=== [migrate] rclone size (dst) ==="
        rclone size "dst:$$DST_BUCKET" --config /config/rclone.conf
        echo "=== [migrate] done ==="
    networks:
      - app-network

  configure-storage:
    image: public.ecr.aws/aws-cli/aws-cli:v2
    profiles: ["migrate"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      ENDPOINT: "http://seaweedfs:8333"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "=== [configure] applying lifecycle rule to $$BUCKET ==="
        aws s3api put-bucket-lifecycle-configuration \
          --endpoint-url "$$ENDPOINT" \
          --bucket "$$BUCKET" \
          --lifecycle-configuration '{"Rules":[{"ID":"temporary-cleanup","Status":"Enabled","Filter":{"Prefix":"temporary/"},"Expiration":{"Days":1}}]}'
        echo "=== [configure] verifying lifecycle configuration ==="
        aws s3api get-bucket-lifecycle-configuration --endpoint-url "$$ENDPOINT" --bucket "$$BUCKET"
        echo "=== [configure] done ==="
    networks:
      - app-network

  stt-service:
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 50800
    ports:
      - "0.0.0.0:50800:50800"
    environment:
      HF_HOME: /app/models
      # STT_THREADS: 4  # Number of CPU threads for transcription (default: auto)
    volumes:
      - stt_models:/app/models
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50800/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
      GOOGLE_GENAI_USE_VERTEXAI: "True"
      NODE_OPTIONS: "--dns-result-order=ipv6first"
      STT_SERVICE_URL: ${STT_SERVICE_URL:-http://stt-service:50800}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      stt-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./secrets/gcp-key.json:/run/secrets/gcp-key.json:ro
    networks:
      - app-network
    read_only: true
    cap_drop:
      - ALL
    user: "65532:65532"
    tmpfs:
      - /tmp:size=50M,mode=1777
      - /app/.next/cache:size=50M,mode=1777

networks:
  app-network:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.250.0/24
        # - subnet: fd00:cafe:face:b00c::/64

volumes:
  db_data:
  minio_data:
  seaweedfs_data:
  stt_models:
